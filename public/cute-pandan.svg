<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pandanGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="pandanGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="pandanGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 2)">
    <!-- Back Pandan Blade Left -->
    <path d="M 50 82 C 30 75 10 50 18 20 C 28 22 42 45 50 82 Z" fill="url(#pandanGrad1)"/>
    
    <!-- Back Pandan Blade Right -->
    <path d="M 50 82 C 70 75 90 50 82 20 C 72 22 58 45 50 82 Z" fill="url(#pandanGrad1)"/>

    <!-- Mid Pandan Blade Left -->
    <path d="M 50 82 C 35 70 20 40 30 12 C 38 18 46 45 50 82 Z" fill="url(#pandanGrad2)"/>

    <!-- Mid Pandan Blade Right -->
    <path d="M 50 82 C 65 70 80 40 70 12 C 62 18 54 45 50 82 Z" fill="url(#pandanGrad2)"/>

    <!-- Center Main Pandan Blade -->
