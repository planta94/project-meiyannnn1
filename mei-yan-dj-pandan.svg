<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pandanGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="pandanGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="pandanGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
    <linearGradient id="djHeadphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="50%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#102027"/>
    </linearGradient>
    <linearGradient id="goldAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 2)">
    <!-- Back Pandan Blade Left -->
    <path d="M 50 82 C 30 75 10 50 18 20 C 28 22 42 45 50 82 Z" fill="url(#pandanGrad1)"/>
    
    <!-- Back Pandan Blade Right -->
    <path d="M 50 82 C 70 75 90 50 82 20 C 72 22 58 45 50 82 Z" fill="url(#pandanGrad1)"/>

    <!-- Mid Pandan Blade Left -->
    <path d="M 50 82 C 35 70 20 40 30 12 C 38 18 46 45 50 82 Z" fill="url(#pandanGrad2)"/>

    <!-- Mid Pandan Blade Right -->
    <path d="M 50 82 C 65 70 80 40 70 12 C 62 18 54 45 50 82 Z" fill="url(#pandanGrad2)"/>

    <!-- Center Main Pandan Blade -->
    <path d="M 50 85 C 40 60 42 30 50 6 C 58 30 60 60 50 85 Z" fill="url(#pandanGrad3)"/>
    <path d="M 50 10 L 50 82" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>

    <!-- Cute Kawaii Character Face -->
    <!-- Eyes -->
    <ellipse cx="43" cy="50" rx="3.2" ry="4.2" fill="#0f382c"/>
    <ellipse cx="57" cy="50" rx="3.2" ry="4.2" fill="#0f382c"/>
    <!-- Eye highlights -->
    <circle cx="44.2" cy="48.5" r="1.3" fill="#ffffff"/>
    <circle cx="58.2" cy="48.5" r="1.3" fill="#ffffff"/>

    <!-- Rosy Blushing Cheeks -->
    <ellipse cx="37.5" cy="55" rx="3.8" ry="2.2" fill="#ff8a80" opacity="0.85"/>
    <ellipse cx="62.5" cy="55" rx="3.8" ry="2.2" fill="#ff8a80" opacity="0.85"/>

    <!-- Cute Happy Smile -->
    <path d="M 45.5 54 Q 50 59.5 54.5 54" fill="none" stroke="#0f382c" stroke-width="2" stroke-linecap="round"/>

    <!-- DJ Studio Headphones -->
    <!-- Headband Arc -->
    <path d="M 28 48 C 26 22 74 22 72 48" fill="none" stroke="url(#djHeadphoneGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 33 46 C 31 28 69 28 67 46" fill="none" stroke="url(#goldAccentGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Left Ear Cushion -->
    <rect x="23" y="44" width="8" height="16" rx="4" fill="url(#djHeadphoneGrad)"/>
    <rect x="25" y="46" width="4" height="12" rx="2" fill="url(#goldAccentGrad)"/>

    <!-- Right Ear Cushion -->
    <rect x="69" y="44" width="8" height="16" rx="4" fill="url(#djHeadphoneGrad)"/>
    <rect x="71" y="46" width="4" height="12" rx="2" fill="url(#goldAccentGrad)"/>

    <!-- Studio Mic Arm -->
    <path d="M 71 56 C 73 66 63 68 58 65" fill="none" stroke="#37474f" stroke-width="2" stroke-linecap="round"/>
    <!-- Mic Tip -->
    <rect x="54" y="63" width="5" height="5" rx="2" fill="url(#goldAccentGrad)"/>
    
    <!-- Sound Waves -->
    <path d="M 80 48 Q 83 52 80 56" fill="none" stroke="#81c784" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 83 45 Q 87 52 83 59" fill="none" stroke="#a5d6a7" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
