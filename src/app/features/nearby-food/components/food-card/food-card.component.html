<mat-card class="food-card" (click)="onSelect()">
  <mat-card-header>
    <mat-card-title>{{ place.name }}</mat-card-title>
    <mat-card-subtitle *ngIf="place.distance">
      {{ place.distance < 1000 ? (place.distance | number:'1.0-0') + 'm' : (place.distance / 1000 | number:'1.1-1') + 'km' }} away
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="rating-row" *ngIf="place.rating">
      <mat-icon color="accent">star</mat-icon>
      <span>{{ place.rating }} ({{ place.userRatingsTotal }})</span>
    </div>

    <div class="status" [ngClass]="{'open': place.openNow, 'closed': place.openNow === false}">
      <span *ngIf="place.openNow === true">Open Now</span>
      <span *ngIf="place.openNow === false">Closed</span>
    </div>
  </mat-card-content>

  <mat-card-actions>
    <button mat-button color="primary" (click)="$event.stopPropagation(); getGoogleMapsLink()">
      <mat-icon>directions</mat-icon> Directions
    </button>
  </mat-card-actions>
</mat-card>
