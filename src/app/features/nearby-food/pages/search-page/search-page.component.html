<app-pandan-bg></app-pandan-bg>

<app-login-card *ngIf="!authService.isAuthenticated()" (loginSuccess)="onLoginSuccess()"></app-login-card>

<header class="header">
  <div class="header-content">
    <div class="brand">
      <div class="logo-badge">
        <img src="mei-yan-dj-pandan.svg" alt="Mei Yan DJ Pandan" class="pandan-brand-icon" />
      </div>
      <div class="brand-text">
        <h1>斑兰Yan</h1>
        <p class="tagline">
          <mat-icon class="tag-sparkle">auto_awesome</mat-icon>
          <span>颜薇恩的斑兰指南 • Food Finder</span>
        </p>
      </div>
    </div>
    <button mat-icon-button class="logout-btn" *ngIf="authService.isAuthenticated()" (click)="onLogout()"
      aria-label="Log out of application" title="Log out">
      <mat-icon class="logout-icon">logout</mat-icon>
    </button>
  </div>
</header>

<!-- Modal Popup Overlay for Errors & No Results -->
<div class="modal-backdrop"
  *ngIf="!store.loading() && !isModalDismissed && (store.error() || store.sortedPlaces().length === 0)"
  (click)="dismissModal()" (keyup.escape)="dismissModal()" tabindex="0" role="dialog">
  <div class="modal-card" (click)="$event.stopPropagation()" (keyup.escape)="$event.stopPropagation()" tabindex="0">
    <button mat-icon-button type="button" class="modal-close-btn" (click)="dismissModal()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
    <app-empty-state [error]="store.error()" (retry)="initLocationAndSearch()">
    </app-empty-state>
  </div>
</div>

<main class="content-container">
  <app-mei-yan-banner></app-mei-yan-banner>

  <section class="controls-section">
    <app-filter-panel (filterChange)="onFilterChange($event)"></app-filter-panel>
  </section>

  <section class="main-content">
    <div class="map-section">
      <div class="section-header-row">
        <div class="section-label">
          <mat-icon>map</mat-icon>
          <span>Map</span>
        </div>
        <div class="map-status-pill" *ngIf="store.loading()">
          <mat-spinner diameter="16"></mat-spinner>
          <span>Searching nearby...</span>
        </div>
      </div>

      <div class="map-container-relative">
        <app-map [currentLocation]="store.currentLocation()" [places]="store.sortedPlaces()"
          [selectedPlace]="store.selectedPlace()" [radius]="store.radius()" (select)="onPlaceSelect($event)">
        </app-map>

        <!-- Selected Place Floating Card Overlay (Appears on marker click) -->
        <div class="selected-card-overlay" *ngIf="store.selectedPlace()">
          <button mat-icon-button type="button" class="close-card-btn" (click)="store.setSelectedPlace(null)"
            aria-label="Close details">
            <mat-icon>close</mat-icon>
          </button>
          <app-food-card [place]="store.selectedPlace()!"></app-food-card>
        </div>
      </div>
    </div>
  </section>
</main>
